<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Timebits</title>
<meta name="theme-color" content="#17171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timebits">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #17171c; --fg: #facd3c; --dim: #3a3a44; --text: #f2f2f5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background-color .4s, color .4s;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
    touch-action: none; /* no pinch or double-tap zoom */
  }
  main {
    height: 100vh; height: 100dvh;
    max-width: 640px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* while counting down the picture uses the whole browser width; heading and buttons stay in the column */
  main:has(> #run:not([hidden])) { max-width: none; }
  #run > :not(#stage) { margin-left: max(0px, calc((100% - 600px) / 2)); }
  #run > .foot { margin-right: max(0px, calc((100% - 600px) / 2)); margin-bottom: -12px; }   /* the buttons sit a little lower, still clear of the home bar */
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button { cursor: pointer; touch-action: manipulation; }
  input { -webkit-user-select: text; user-select: text; }
  /* the numbers on the start screen: changeable by typing, nothing gets marked or offered for copying */
  #minVal, .pnum { caret-color: var(--fg); -webkit-touch-callout: none; }
  #minVal::selection, .pnum::selection { background: transparent; }
  .muted { opacity: .5; }

  /* setup */
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  #label {
    width: 100%; text-align: center; font-size: 22px; padding: 10px 0;
    border-bottom: 1px solid var(--dim); transition: border-color .3s;
  }
  #label:focus { border-color: var(--fg); }
  #label::placeholder { color: var(--text); opacity: .35; }
  .seg { display: flex; justify-content: center; align-items: center; gap: 12px; }
  .seg span { font-size: 15px; opacity: .25; }
  .seg button { font-size: 15px; padding: 6px 2px; opacity: .4; border-bottom: 2px solid transparent; }
  .seg button[aria-pressed="true"] { opacity: 1; border-color: var(--fg); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .step {
    width: 56px; height: 56px; border-radius: 50%; flex: none;
    border: 1px solid var(--dim); font-size: 26px; line-height: 1;
  }
  .step:active { background: var(--dim); }
  #minVal, #timeVal { text-align: center; font-size: 64px; font-weight: 700; color: var(--fg); }
  #minVal { width: 150px; -moz-appearance: textfield; }
  #minVal::-webkit-inner-spin-button, #minVal::-webkit-outer-spin-button { -webkit-appearance: none; }
  #timeVal { display: block; font-size: min(56px, 13vw); font-variant-numeric: tabular-nums; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* the phone's own time picker lies invisibly over the time: a tap on it opens the picker, and the time can't be selected or copied */
  #timeBox { position: relative; display: flex; align-items: center; gap: 8px; }
  @media (min-width: 360px) { #timeBox { padding-left: 30px; } }   /* as much room on the left as the clock takes on the right, so the time stays centred */
  /* a small clock beside the time says "this is a clock, tap to pick" (the hidden picker's own icon doesn't show) */
  #timeBox .clock { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
  #timePick { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; -webkit-user-select: none; user-select: none; }
  #timePick::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; opacity: 0; cursor: pointer; }
  /* the short line under Minutes / Time: when it ends, or how long it runs */
  .pane { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .hint { margin: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
  /* pomodoro: one row per length, the same widget as Minutes, just smaller */
  #pomoPane { display: grid; grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 14px 18px; }
  #pomoSum { grid-column: 1 / -1; text-align: center; font-size: 15px; line-height: 1.4; margin-bottom: 14px; }
  #pomoPane .lab { font-size: 15px; text-align: right; white-space: nowrap; }
  #pomoPane .lab small { display: block; font-size: 12px; opacity: .7; }
  #pomoPane .stepper { gap: 8px; }
  #pomoPane .step { width: 44px; height: 44px; font-size: 22px; }
  .pnum { width: 84px; text-align: center; font-size: 40px; font-weight: 700; color: var(--fg); -moz-appearance: textfield; }
  .pnum::-webkit-inner-spin-button, .pnum::-webkit-outer-spin-button { -webkit-appearance: none; }
  .primary {
    height: 56px; border-radius: 28px; background: var(--fg); color: var(--bg);
    font-size: 18px; font-weight: 700; transition: background-color .4s, color .4s;
  }
  .primary:active { transform: scale(.98); }

  /* countdown */
  #count, #sub { width: fit-content; }
  .nohead #count, .nohead #sub { display: none; }
  /* bold and centred over the picture, in the same airy letter spacing as the buttons below */
  #count { font-size: clamp(26px, 7.5vw, 36px); font-weight: 700; letter-spacing: .04em; line-height: 1.1; }
  #sub { margin-top: 4px; font-size: 15px; min-height: 1.3em; }
  #run > #count, #run > #sub { margin-left: auto; margin-right: auto; text-align: center; }
  #stage { flex: 1; min-height: 0; position: relative; margin: 20px 0 8px; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* pause above exit, always: the picture keeps its height. "Sure?" / Yes / No lies over the same spot (hidden, not removed) */
  .foot { display: grid; justify-items: center; }
  .foot > .focol { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; max-width: 100%; }
  .foot > .ask { visibility: hidden; }
  .asking .foot > .ask { visibility: visible; }
  .asking .foot > #footMain { visibility: hidden; }
  #stage { transition: opacity .4s; }
  .paused #stage { opacity: .3; }
  .paused.nodim #stage { opacity: 1; }   /* the theme shows the pause itself */
  .exit { align-self: center; padding: 12px 28px; font-size: 15px; letter-spacing: .06em; }
  /* the away text stays on one line (smaller on a narrow phone), so the height never changes with "I'm back" */
  #pause, #askQ { padding: 10px 12px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: min(15px, 3.6vw); }
  /* space between pause and exit, so a tap meant for one doesn't hit the other */
  #pause, #askQ { margin-bottom: 7px; }
  #run .foot #exit, #run .foot .askRow > .exit { padding-top: 6px; }
  #run .foot .exit { font-size: min(15px, 3.6vw); }   /* Exit, No and Yes as big as the pause text, which shrinks on a narrow phone */
  .askRow { display: flex; }
  /* the middle of the row (where Exit was) is a dead spot, so a double tap on Exit can never land on Yes */
  #run .foot .askRow > .askGap { padding: 6px 0 12px; width: 24px; }
  .peek .foot { visibility: hidden; }   /* the last picture from the done page: nothing to press */

  /* done */
  #doneText {
    flex: 1; display: grid; place-items: center; text-align: center;
    font-size: clamp(64px, 22vw, 120px); font-weight: 800; color: var(--fg);
    overflow-wrap: anywhere; animation: pop .6s ease-out;
  }
  #art { width: 100%; height: 34vh; }
  #doneText.shake { animation: pop .6s ease-out, shake .45s ease-out; }
  @keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -10px 4px; } 40% { translate: 8px -6px; } 60% { translate: -6px 3px; } 80% { translate: 3px -2px; } }
  #doneText.long { font-size: clamp(40px, 12vw, 72px); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<main>
  <form id="setup" class="screen">
    <div class="center">
      <input id="label" type="text" maxlength="40" placeholder="What for?" aria-label="What for?" autocomplete="off" enterkeyhint="go">

      <div class="seg" role="group">
        <button type="button" data-mode="min" aria-pressed="true">Minutes</button><span aria-hidden="true">/</span>
        <button type="button" data-mode="time" aria-pressed="false">Time</button><span aria-hidden="true">/</span>
        <button type="button" data-mode="pomo" aria-pressed="false">Pomodoro</button>
      </div>

      <div id="minPane" class="pane">
        <div class="stepper">
          <button type="button" class="step" data-d="-1" aria-label="less">−</button>
          <input id="minVal" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="37" aria-label="Minutes">
          <button type="button" class="step" data-d="1" aria-label="more">+</button>
        </div>
        <p id="minHint" class="hint muted"></p>
      </div>
      <div id="timePane" class="pane" hidden>
        <div class="stepper">
          <button type="button" class="step" data-for="time" data-d="-1" aria-label="earlier">−</button>
          <div id="timeBox"><span id="timeVal" aria-hidden="true"></span><svg class="clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2.2"/></svg><input id="timePick" type="time" aria-label="Time"></div>
          <button type="button" class="step" data-for="time" data-d="1" aria-label="later">+</button>
        </div>
        <p id="timeHint" class="hint muted"></p>
      </div>
      <div id="pomoPane" hidden>
        <p id="pomoSum" class="muted"></p>
        <div class="lab muted">Focus</div>
        <div class="stepper">
          <button type="button" class="step" data-for="focus" data-d="-1" aria-label="less">−</button>
          <input id="pomoFocus" class="pnum" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Focus minutes">
          <button type="button" class="step" data-for="focus" data-d="1" aria-label="more">+</button>
        </div>
        <div class="lab muted">Break</div>
        <div class="stepper">
          <button type="button" class="step" data-for="short" data-d="-1" aria-label="less">−</button>
          <input id="pomoShort" class="pnum" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Break minutes">
          <button type="button" class="step" data-for="short" data-d="1" aria-label="more">+</button>
        </div>
        <div class="lab muted">Long break<small>every 4th</small></div>
        <div class="stepper">
          <button type="button" class="step" data-for="long" data-d="-1" aria-label="less">−</button>
          <input id="pomoLong" class="pnum" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Long break minutes">
          <button type="button" class="step" data-for="long" data-d="1" aria-label="more">+</button>
        </div>
      </div>
    </div>
    <button class="primary" type="submit">Start</button>
  </form>

  <section id="run" class="screen" hidden>
    <h1 id="count">37 left</h1>
    <p id="sub" class="muted"></p>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <div class="foot">
      <div class="focol" id="footMain">
        <button class="exit muted" id="pause" type="button">I'm going to the kitchen</button>
        <button class="exit muted" id="exit" type="button">Exit</button>
      </div>
      <div class="focol ask" id="ask">
        <div class="exit" id="askQ">Sure?</div>
        <div class="askRow">
          <button class="exit muted" id="askNo" type="button">No</button>
          <span class="exit askGap"></span>
          <button class="exit muted" id="askYes" type="button">Yes</button>
        </div>
      </div>
    </div>
  </section>

  <section id="done" class="screen" hidden>
    <canvas id="art" hidden></canvas>
    <div id="doneText">DONE!</div>
    <button id="again" class="exit muted" type="button">Exit</button>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const TITLE = 'Timebits';
  // no zooming: iOS Safari ignores user-scalable=no, desktop zooms with ctrl + wheel or keys
  for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
  const ls = {
    get(k)    { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k)    { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ================= looks: palettes x modes, shuffled on every tap =================

  const PALETTES = [
    { bg: '#17171c', fg: '#facd3c', dim: '#3a3a44', text: '#f2f2f5', dark: true },  // night
    { bg: '#f3eee4', fg: '#e0503a', dim: '#ddd4c3', text: '#2a2a2a' },             // paper
    { bg: '#10241c', fg: '#8fe0a0', dim: '#2a4a3c', text: '#e6f4e9', dark: true },  // forest
    { bg: '#0a2342', fg: '#4fd8e0', dim: '#1f4068', text: '#e0f7fa', dark: true },  // ocean
    { bg: '#2b1a3b', fg: '#ff8a5c', dim: '#4a3360', text: '#ffd9b8', dark: true },  // dusk
    { bg: '#e6f5ee', fg: '#178a6c', dim: '#c6e3d6', text: '#0e3b30' },             // mint
    { bg: '#fff0f3', fg: '#f0507f', dim: '#f4d2db', text: '#5a2638' },             // blush
    { bg: '#000000', fg: '#ffffff', dim: '#2e2e2e', text: '#ffffff', dark: true },  // mono
    { bg: '#fbf5d8', fg: '#2d3ca0', dim: '#e9e0b2', text: '#2d3ca0' },             // cobalt
    { bg: '#1a0e09', fg: '#ff5233', dim: '#3e2318', text: '#ffb39c', dark: true },  // ember
    { bg: '#ece8ff', fg: '#6a4cf0', dim: '#d5cef7', text: '#2c2060' },             // lavender
    { bg: '#0a0d0a', fg: '#39ff6a', dim: '#163a20', text: '#39ff6a', dark: true },  // terminal
  ];

  // real-looking penguins (on request: real colours instead of the palette, see CLAUDE.md): sea-blue water, black and white birds, orange beaks, white ice
  const REAL = {
    pal: { bg: '#2c79ad', fg: '#1d1f26', dim: '#5597c6', text: '#ffffff', dark: true },
    belly: '#ffffff', beak: '#f39a2b', eye: '#1d1f26', blush: '#f6b3b8',
    ice: { top: '#f2f8fc', side: '#b4d8ee', deep: '#4f97c9', rim: '#ffffff' },
  };

  // layout: positions for n items in a w x h box, plus item size d.
  // optional per mode: live (always animating), pos (moving items), item (custom drawing),
  // before/after (extra drawing), step (physics), tap, goneScale/goneDim/goneMs (how past items look)
  // off: true = taken offline (kept for later), not in the random rotation
  const ALL_MODES = [
    { name: 'dots',     off: true, shape: 'circle',  lay: (n, w, h) => grid(n, w, h, 1.6, 1.6) },
    { name: 'squares',  off: true, shape: 'square',  lay: (n, w, h) => grid(n, w, h, 1.5, 1.5) },
    { name: 'snake', snd: 'snake',    shape: 'circle',  body: 0.42, eyes: true, glance: snakeGlance, lay: (n, w, h) => grid(n, w, h, 1.45, 1.45, { snake: true, pad: 1.5 }), after: snakeFace, tap: snakeTap },
    { name: 'spiral', snd: 'spiral',   shape: 'circle',  guide: 'path', lay: spiral },
    { name: 'clock', snd: 'clock',    shape: 'circle',  guide: 'ring', lay: ring },
    { name: 'bars',     off: true, shape: 'bar',     lay: (n, w, h) => grid(n, w, h, 1.8, 3.6, { max: 65 }) },
    { name: 'honey', snd: 'honey',    shape: 'hex',     halo: X => ({ poly: starPoly(6, X.d * 0.6, X.d * 0.6) }), lay: (n, w, h) => grid(n, w, h, 0.95, 0.82, { offset: true, max: 140 }) },
    { name: 'rings', snd: 'rings',    shape: 'ring',    lay: (n, w, h) => grid(n, w, h, 1.5, 1.3, { offset: true }) },
    { name: 'diamonds', snd: 'diamonds', shape: 'diamond', hit: 0.4, lay: (n, w, h) => grid(n, w, h, 1.1, 0.55, { offset: true, max: 170 }) },
    { name: 'tiles',    off: true, shape: 'tri',     hit: 0.3, lay: (n, w, h) => grid(n, w, h, 0.58, 0.95, { max: 190 }) },
    // petals fall off and land on the ground
    { name: 'flower', lay: flower, reverse: true, goneScale: 0.45, goneMs: 2600, pos: petalPos, item: petal, halo: (X, p, q) => ({ rx: p.len * 0.58, ry: p.wid * 0.62, rot: q ? q.r : p.a }), before: stem, after: flowerCenter },
    // moons circle a planet, a passed minute drifts off into space
    { name: 'orbit', shape: 'circle', live: true, hit: 0.8, goneScale: 1, goneDim: 0.3, goneMs: 3000, lay: orbit, pos: moonPos, before: planet, bodyTap: saturnTap },
    // a full jar of balls with gravity; tapping kicks one up, a passed minute makes the top one jump out
    { name: 'jar', shape: 'circle', hit: 0.6, goneScale: 1, goneDim: 0, goneMs: 2400, goneLinear: true,
      lay: jar, step: jarStep, pos: ballPos, item: jarBall, tap: jarTap, before: drawJar },
    // crawling caterpillar, turns into a butterfly at the end
    { name: 'caterpillar', shape: 'circle', live: true, body: 0.8, eyes: true, stripes: true, endArt: 'butterfly',
      lay: (n, w, h) => grid(n, w, h, 0.78, 1.6, { snake: true, max: 40, pad: 1.2 }), pos: crawl, after: antennae, tap: smile },
    // sand runs from the top bulb into the bottom one
    { name: 'hourglass', shape: 'circle', goneScale: 1, goneDim: 0.55, goneMs: 1600, noDim: true, lay: hourglass, pos: grainPos, item: grain, before: glass, after: plug },
    // a burning fuse with sparks
    { name: 'fuse', shape: 'circle', live: true, endArt: 'bang', goneScale: 0.4, lay: fuse, step: fuseStep, before: fuseLine, after: sparks },
    // a bar of chocolate on its opened foil, eaten from the top: each minute the top piece snaps off and floats away, crumbs stay on the foil
    { name: 'chocolate', goneScale: 1, goneDim: 0, goneMs: 1500, goneLinear: true, lay: chocolateBar,
      pos: chunkPos, item: chunk, halo: (X, p, q) => ({ rx: X.d * 0.55, ry: X.geo.choc.ph * 0.55, rot: q ? q.r || 0 : 0, rect: true }), before: chocFoil },
    // beads slide along the wires of an abacus
    { name: 'abacus', goneScale: 1, goneDim: 0.5, goneMs: 700, lay: abacus, pos: beadPos, item: bead, halo: X => ({ rx: X.d * 0.54, ry: X.geo.abacus.bh * 0.58 }), before: abacusFrame },
    // twinkling constellation, stars go out one by one
    { name: 'stars', live: true, hit: 0.8, goneScale: 0.25, halo: X => ({ poly: starPoly(4, X.d * 0.62, X.d * 0.22) }), lay: stars, pos: twinkle, item: star, before: starLines },
    // a cute spider, its legs drop off one by one
    // a shy hedgehog loses its spines and blushes more and more
    { name: 'hedgehog', live: true, noDim: true, goneScale: 0.5, goneMs: 1500, lay: hedgehog, pos: hogPos, item: spine, halo: (X, p, q) => {
        // a spike around the spike: the body covers its base, so only the edge along the tip shows
        const l = p.len * 0.5, w = Math.max(p.wid * 0.5, 2), pad = Math.max(3, w * 0.5);
        return { poly: [[-l, -w - pad], [l + pad * 1.6, 0], [-l, w + pad]], rot: p.ang + (q ? q.r || 0 : 0) };
      }, after: hogBody, bodyTap: hogTap },
    // people in a cinema, one leaves per minute; the countdown runs on the screen instead of the headline
    { name: 'cinema', live: true, noHead: true, goneScale: 1, goneDim: 0, goneMs: 3500, lay: cinema, pos: leave, item: person, before: cinemaScreen },
    { name: 'spider', live: true, goneScale: 0.4, goneMs: 1600, lay: spider, pos: legPos, item: leg, before: thread, after: spiderBody, bodyTap: spiderTap },
    // toy cars pottering around, tapping one makes it zoom off a bit with a puff from the exhaust (no ring), a passed minute drives off screen
    { name: 'cars', live: true, hit: 0.6, goneScale: 1, goneDim: 0, goneMs: 3000, lay: cars, step: carStep, pos: carPos, item: car, noRing: true, after: carPuffs, tap: carTap },
    // ducklings swim in line behind their mother, the last one loses track each minute; tap the mother and she looks back
    { name: 'ducks', live: true, playable: true, goneScale: 1, goneDim: 0, goneMs: 3500, lay: ducks, step: duckStep, pos: duckPos, item: duckling, halo: (X, p, q) => ({ rx: X.d * 0.62, ry: X.d * 0.4, rot: q ? q.r || 0 : 0 }),
      tap: () => peep(), after: motherDuck, bodyTap: duckTap },
    // a thermometer that gets colder each minute; the top segment cools off and fades, the temperature replaces the headline
    { name: 'thermometer', live: true, noHead: true, noDim: true, goneScale: 1, goneDim: 0, goneMs: 1800, goneLinear: true, endArt: 'shatter',
      lay: thermometer, pos: freeze, item: segment, before: thermoGlass, after: beanie, bodyTap: thermoTap },
    // a marble run: each minute the gate lets one ball roll down the zigzag ramps into the tray
    { name: 'marbles', goneScale: 1, goneDim: 0, goneMs: 2400, goneLinear: true,
      lay: marbleRun, step: mbStep, pos: mbPos, item: mbBall, tap: mbTap, before: mbTrack },
    // a bunch of balloons tied at one knot: the outermost pops each minute and its string dangles from the knot; a tap pushes one away
    { name: 'balloons', live: true, goneScale: 1, goneDim: 0, goneMs: 1500, goneLinear: true,
      lay: balloons, pos: balloonPos, item: balloon, tap: balloonTap, before: balloonStrings,

    const gs = M.goneScale === undefined ? 0.35 : M.goneScale, gd = M.goneDim === undefined ? 1 : M.goneDim;

      const i = geo.order ? geo.order[k] : M.reverse ? n - 1 - k : k, p = pts[i], g = p.g, q = p.q;
      let pk = 0, pt01 = 0;
      const pt = pulses.get(i);
      if (pt !== undefined) {
        pt01 = (now - pt) / 450;
        if (pt01 >= 1) pulses.delete(i); else { busy = true; pk = Math.sin(Math.PI * pt01); }
      }
      const sc = (1 - (1 - gs) * g) * intro(i) * (1 + 0.3 * pk) * (q && q.s !== undefined ? q.s : 1);
      p.hidden = d * sc <= 0.2 || (q && q.a === 0);
      if (p.hidden) continue;
      let col = M.stripes && i % 2 ? mix(P.fg, P.bg, 0.15) : P.fg;
      const tn = tints.get(i);
      if (tn) {
        const tt = clamp((now - tn.t0) / 350);
        if (tt < 1) busy = true;

      }

        const hz = M.halo && M.halo(X, p, p.q), s = 1 + 0.6 * pt01;

          c.save(); c.translate(p.cx, p.cy); c.rotate(hz.rot || 0);
          c.beginPath();
          if (hz.poly) { hz.poly.forEach(([x, y]) => c.lineTo(x * s, y * s)); c.closePath(); }
          else if (hz.rect) rr(c, -hz.rx * s, -hz.ry * s, 2 * hz.rx * s, 2 * hz.ry * s, Math.min(hz.rx, hz.ry) * s * 0.4);

    if (X.more) busy = true;

    if (M.eyes && shownMin > 0 && d > 12) {
      // the eyes look straight at us; a theme can make them glance somewhere for a moment (M.glance: direction ux, uy and amount a)
      // glancing sideways, the far eye moves more than the near one, as if the head turned
      const p = pts[0], e = d * 0.09 * intro(0), gl = M.glance && M.glance(X);

  // how tightly the items sit: the median distance from an item to its nearest neighbour (worked out once per layout)
  function itemSpacing() {
    if (geo.nn === undefined) {
      const P = geo.pts.filter(p => !p.hidden), near = [];
      for (const a of P) {
        let m = Infinity;
        for (const b of P) if (a !== b) m = Math.min(m, Math.hypot((a.cx === undefined ? a.x : a.cx) - (b.cx === undefined ? b.x : b.cx), (a.cy === undefined ? a.y : a.cy) - (b.cy === undefined ? b.y : b.cy)));
        near.push(m);
      }
      near.sort((u, v) => u - v);
      geo.nn = near.length > 1 ? near[near.length >> 1] : Infinity;
    }
    return geo.nn;
  }

  // direct: only real hits, without the reach into the gaps (so a body like the mother duck is asked first)
  function hitTest(x, y, direct) {
    const M = MODES[look.m], d = geo.d, playable = M.snd || M.playable;
    let hit = -1, best = Infinity, near = -1, nearD = Infinity;
    for (let i = 0; i < geo.pts.length; i++) {
      const p = geo.pts[i];
      if (p.hidden && !M.keepHit) continue;
      const px = p.hidden || p.cx === undefined ? p.x : p.cx, py = p.hidden || p.cy === undefined ? p.y : p.cy;
      const dx = Math.abs(px - x), dy = Math.abs(py - y);
      const inside = M.shape === 'bar' ? dx < d * 0.7 && dy < d * 1.6 : Math.hypot(dx, dy) < (p.hr || d * (M.hit || 0.55));
      if (inside) { if (dx + dy < best) { best = dx + dy; hit = i; } }
      else if (playable) { const e = Math.hypot(dx, dy); if (e < nearD) { nearD = e; near = i; } }
    }
    // a theme you play like an instrument: a tap that lands in the small gap between tightly packed items still counts
    // for the nearest one and doesn't change the look (reach: 3/4 of the spacing, but at most half an item past the hit radius)
    if (hit < 0 && near >= 0 && !direct) {
      const r0 = d * (M.hit || 0.55);
      if (nearD < Math.max(r0, Math.min(0.75 * itemSpacing(), r0 + 0.5 * d))) hit = near;
    }
    return hit;   // may also be a past item
  }

  function restyle() {
    look = { m: nextMode(look.m), p: nextPal(look.p) };
    ls.set('timebits-look', look);
    applyPalette();
    born = performance.now();
    pulses.clear(); tints.clear();
    relayout();
  }

  // leftovers of past minutes that a theme draws itself, not as items (crumbs, dangling strings, swimming penguins):
  // they stand for time already gone, so a tap on them changes the look like a past item. A theme registers each one while drawing.
  function leftover(X, x, y, r) { X.geo.left.push({ x, y, r }); }
  function onLeftover(x, y) { return (geo.left || []).some(o => Math.hypot(o.x - x, o.y - y) < o.r); }

  // is anything drawn near this point (planet, jar, stem, lines ...)? those are neutral, a tap does nothing
  function onDrawing(x, y) {
    const k = canvas.width / W, rad = 8;
    const sx = Math.max(0, Math.floor((x - rad) * k)), sy = Math.max(0, Math.floor((y - rad) * k));
    const sw = Math.min(canvas.width, Math.ceil((x + rad) * k)) - sx, sh = Math.min(canvas.height, Math.ceil((y + rad) * k)) - sy;
    if (sw <= 0 || sh <= 0) return false;
    const a = ctx.getImageData(sx, sy, sw, sh).data;
    for (let j = 3; j < a.length; j += 4) if (a[j] > 20) return true;
    return false;
  }

  // tap an item -> it pulses; tap on empty background or a past item -> new look; anything else -> nothing
  // (on the document, so the empty space beside the centered column in a wide browser counts as background too)
  document.addEventListener('pointerdown', e => {
    if (peek && !$('run').hidden) { if (++peekTaps >= 3) leavePeek(); return; }
    if ($('run').hidden || e.target.closest('.exit, #count, #sub')) return;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    // a body (mother duck, hedgehog, spider ...) right under the finger wins over the reach into the gaps between items
    let i = hitTest(x, y, true);
    if (i < 0 && !pausedAt && MODES[look.m].bodyTap && MODES[look.m].bodyTap(geo, x, y)) {
      if (navigator.vibrate) navigator.vibrate(8);
      return kick();
    }
    if (i < 0) i = hitTest(x, y);
    if (i >= shownMin) return restyle();   // a past item (time already gone) counts like the empty background: new look
    if (i >= 0 && pausedAt) return;   // paused: items (and bodies, below) stay quiet; only a tap on empty background still changes the look
    if (i >= 0) {
      const now = performance.now(), M = MODES[look.m];
      pulses.set(i, now);
      // sometimes the item also takes on a slightly different colour
      if (Math.random() < 0.45) {
        // always a neighbour of the palette colour, so repeated taps don't drift away
        const base = curPal().fg, tn = tints.get(i);
        tints.set(i, { from: tn ? tn.to : base, to: nudge(base), t0: now });
      }
      if (M.tap) M.tap(geo, i);
      if (M.snd) tapChime(M.snd);
      if (navigator.vibrate) navigator.vibrate(8);
      kick();
    } else if (onLeftover(x, y) || !onDrawing(x, y)) restyle();
  });

  // ---- animation on the end screen: butterfly (after the caterpillar) or a bang (after the fuse) ----
  let artRaf = 0, artKind = '';
  function endArt(kind) {
    const cv = $('art');
    artKind = kind || '';
    cv.hidden = !kind;
    cancelAnimationFrame(artRaf);
    $('doneText').classList.remove('shake');
    if (!kind) return;
    const x = cv.getContext('2d'), t0 = performance.now(), P0 = curPal();
    let bits = [];
    if (kind === 'bang') {
      void $('doneText').offsetWidth;   // restart the css animation
      $('doneText').classList.add('shake');
      const cols = [P0.fg, nudge(P0.fg), nudge(P0.fg), mix(P0.fg, '#ffffff', 0.6), P0.text];
      for (let i = 0; i < 160; i++) {
        const a = Math.random() * TAU, v = 120 + Math.random() * 520;
        bits.push({ vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 1.5 + Math.random() * 3.5, col: cols[i % cols.length] });
      }
    } else if (kind === 'shatter') {
      const cols = [ICE, '#bfe9ff', '#6cc4ff', '#ffffff'];
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * TAU, v = 80 + Math.random() * 380;
        bits.push({ vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, r: 4 + Math.random() * 10, rot: Math.random() * TAU, spin: (Math.random() - 0.5) * 8, col: cols[i % cols.length] });
      }
    }

      if ($('done').hidden) return;
      const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      x.clearRect(0, 0, r.width, r.height);
      const P = curPal();
      let more = !still;
      if (kind === 'butterfly') {
        const s = Math.min(r.width, r.height) * 0.42, t = still ? 0 : now / 1000;
        const f = still ? 1 : 0.3 + 0.7 * Math.abs(Math.cos(t * 4));
        x.save();
        x.translate(r.width / 2 + Math.sin(t * 0.9) * s * 0.25, r.height / 2 + Math.sin(t * 1.7) * s * 0.12);
        for (const side of [-1, 1]) {
          x.save(); x.scale(side * f, 1);
          x.fillStyle = P.fg; x.beginPath(); x.ellipse(s * 0.42, -s * 0.18, s * 0.42, s * 0.3, -0.5, 0, TAU); x.fill();
          x.fillStyle = mix(P.fg, P.text, 0.35); x.beginPath(); x.ellipse(s * 0.3, s * 0.25, s * 0.26, s * 0.2, 0.5, 0, TAU); x.fill();
          x.restore();

        x.lineWidth = s * 0.08; x.beginPath(); x.moveTo(0, -s * 0.3); x.lineTo(0, s * 0.4); x.stroke();
        x.lineWidth = s * 0.025; x.beginPath();
        x.moveTo(0, -s * 0.3); x.quadraticCurveTo(-s * 0.1, -s * 0.55, -s * 0.22, -s * 0.62);
        x.moveTo(0, -s * 0.3); x.quadraticCurveTo(s * 0.1, -s * 0.55, s * 0.22, -s * 0.62);
        x.stroke();
        x.restore();
      } else if (kind === 'shatter') {
        // an icy flash, then shards that tumble down and melt away
        const e = still ? 0.4 : (now - t0) / 1000, cx = r.width / 2, cy = r.height * 0.55;
        if (e < 0.25) { x.globalAlpha = 1 - e / 0.25; x.fillStyle = ICE; x.beginPath(); x.arc(cx, cy, 20 + e * 500, 0, TAU); x.fill(); }
        const k = (1 - Math.exp(-2.5 * e)) / 2.5;
        x.globalAlpha = Math.max(0, 1 - e / 2.6);
        for (const b of bits) {
          x.save();
          x.translate(cx + b.vx * k, cy + b.vy * k + 260 * e * e);
          x.rotate(b.rot + b.spin * e);
          x.fillStyle = b.col;
          x.beginPath(); x.moveTo(0, -b.r); x.lineTo(b.r * 0.45, b.r * 0.7); x.lineTo(-b.r * 0.5, b.r * 0.4); x.closePath(); x.fill();
          x.restore();
        }
        x.globalAlpha = 1;
        if (e > 2.6) more = false;
      } else {
        // flash, shock ring, then sparks that slow down, sink and fade
        const e = still ? 0.35 : (now - t0) / 1000, cx = r.width / 2, cy = r.height * 0.6;
        if (e < 0.3) { x.globalAlpha = 1 - e / 0.3; x.fillStyle = P.text; x.beginPath(); x.arc(cx, cy, 30 + e * 600, 0, TAU); x.fill(); }
        if (e < 0.7) { x.globalAlpha = 1 - e / 0.7; x.strokeStyle = P.fg; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, e * 700, 0, TAU); x.stroke(); }
        const k = (1 - Math.exp(-3 * e)) / 3;
        x.globalAlpha = Math.max(0, 1 - e / 2.4);
        for (const b of bits) {
          x.fillStyle = b.col;
          x.beginPath(); x.arc(cx + b.vx * k, cy + b.vy * k + 120 * e * e, b.r, 0, TAU); x.fill();
        }
        x.globalAlpha = 1;
        if (e > 2.4) more = false;
      }
      if (more) artRaf = requestAnimationFrame(loop);
    };
    artRaf = requestAnimationFrame(loop);
  }

  // on the end screen a tap just swaps the colours
  // a little secret: tapping the done page 10 times shows the look's last picture (all minutes gone,
  // e.g. the hedgehog without spines); 3 taps there go back to the done page
  let doneTaps = 0, peek = false, peekTaps = 0, peekArt = '';
  $('done').addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    look.p = nextPal(look.p);
    ls.set('timebits-look', look);
    applyPalette();
    if (artKind && still) endArt(artKind);
    if (++doneTaps >= 10 && total > 0) {
      e.stopPropagation();   // this tap must not count on the picture already
      doneTaps = 0; peek = true; peekTaps = 0; peekArt = artKind;
      endArt('');
      shownMin = 0; goneAt.clear(); pulses.clear(); tints.clear();
      $('run').classList.add('peek');
      show('run');
      relayout();
    }
  });
  function leavePeek() {
    peek = false;
    $('run').classList.remove('peek');
    show('done');
    endArt(peekArt);
  }

  // ================= sound (browsers only allow it after a tap, so we unlock on Start) =================

  function unlockAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
    } catch (e) {}
  }
  document.addEventListener('pointerdown', unlockAudio);

  // one oscillator through a gain envelope: quick (or slow) attack, exponential fade
  function voice(a, dest, f, t, dur, peak, type, att) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }

  // output with a space echo; every sound plays into this
  function spaceOut(a, delay, feedback, wetLevel) {
    const out = a.createGain(), echo = a.createDelay(1), fb = a.createGain(), wet = a.createGain();
    out.gain.value = 0.5;
    echo.delayTime.value = delay; fb.gain.value = feedback; wet.gain.value = wetLevel;
    out.connect(a.destination);
    out.connect(echo); echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(a.destination);
    return out;
  }

  function noise(a, dur) {
    const b = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource();
    s.buffer = b;
    return s;
  }

  const rand = (lo, hi) => lo + Math.random() * (hi - lo);

    // crystal rain: random glassy plinks
    [0.23, 0.45, 0.45, (a, out, t0) => {
      const notes = [1567.98, 1760, 2093, 2349.3, 2637, 3136];
      for (let k = 0; k < 9; k++) {
        const f = notes[Math.floor(Math.random() * notes.length)], t = t0 + rand(0, 1.2), p = rand(0.04, 0.07);
        voice(a, out, f, t, 0.6, p, 'sine', 0.003);
        voice(a, out, f * 2.76, t, 0.25, p / 4, 'sine', 0.003);
      }
    }],
    // tractor beam: a rising tone that pulses faster and faster
    [0.27, 0.35, 0.45, (a, out, t0) => {
      const trem = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
      trem.gain.value = 0.5; lg.gain.value = 0.5;
      lfo.frequency.setValueAtTime(6, t0);
      lfo.frequency.exponentialRampToValueAtTime(24, t0 + 1.5);
      lfo.connect(lg).connect(trem.gain);
      trem.connect(out);
      lfo.start(t0); lfo.stop(t0 + 1.7);
      [[330, 0.12], [495, 0.04]].forEach(([f, p]) =>
        voice(a, trem, f, t0, 1.6, p, 'sine', 0.3).frequency.exponentialRampToValueAtTime(f * 2, t0 + 1.4));
    }],
    // bubble portal: a few bubbles, then a soft chime
    [0.2, 0.35, 0.45, (a, out, t0) => {
      let t = t0;
      for (let k = 0; k < 6; k++) {
        const f = rand(300, 700);
        voice(a, out, f, t, 0.1, 0.1, 'sine', 0.005).frequency.exponentialRampToValueAtTime(f * 3, t + 0.08);
        t += rand(0.1, 0.2);
      }
      voice(a, out, 200, t, 0.18, 0.14, 'sine', 0.01).frequency.exponentialRampToValueAtTime(700, t + 0.15);
      [1046.5, 1568].forEach((f, k) => voice(a, out, f, t + 0.15 + k * 0.08, 1.3, 0.06, 'sine', 0.01));
    }],
  ];

  function boom() {
    if (!audio) return;
    const a = audio, t = a.currentTime + 0.02, len = Math.floor(a.sampleRate * 0.5);
    const buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(), lp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 900; g.gain.value = 0.5;
    src.connect(lp).connect(g).connect(a.destination); src.start(t);
    const o = a.createOscillator(), og = a.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
    og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(og).connect(a.destination); o.start(t); o.stop(t + 0.5);
  }

  // play a random end sound, never the same one twice in a row
  let lastSound = -1;
  function beep() {
    if (!audio) return;
    audio.resume();
    let i;
    do i = Math.floor(Math.random() * SOUNDS.length); while (i === lastSound);
    lastSound = i;
    const [delay, feedback, wetLevel, play] = SOUNDS[i];
    play(audio, spaceOut(audio, delay, feedback, wetLevel), audio.currentTime + 0.05);
  }

  // ================= native app (Capacitor): alarm even when the phone is locked =================
  // In the browser this does nothing. In the store app it uses @capacitor/local-notifications.

  const native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    ? window.Capacitor.Plugins : null;

  // in the browser: one timer right at the end, so a tab in the background still ends (and rings) on time;
  // the once-a-second tick gets slowed down there. On a phone the page usually sleeps until it's opened again.
  let endTimer = 0;
  function scheduleAlarm() {
    clearTimeout(endTimer);
    endTimer = setTimeout(() => { if (!pausedAt && !$('run').hidden) tick(); }, Math.max(0, end - Date.now() - 950));
    const LN = native && native.LocalNotifications;
    if (!LN) return;
    LN.requestPermissions()
      .then(() => LN.schedule({ notifications: [{
        id: 1, title: (pomo < 0 ? label || 'Done' : pomo % 2 ? 'Focus' : 'Break') + '!', body: 'Time is up.',
        schedule: { at: new Date(end), allowWhileIdle: true },
      }] }))
      .catch(() => {});
  }
  function cancelAlarm() {
    clearTimeout(endTimer);
    const LN = native && native.LocalNotifications;
    if (LN) LN.cancel({ notifications: [{ id: 1 }] }).catch(() => {});
  }

  // browser notification when time is up and the countdown isn't in front (the app does this with LocalNotifications)
  function askToNotify() {
    if (native || !('Notification' in window) || Notification.permission !== 'default') return;
    try { const p = Notification.requestPermission(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  function notify(title, body) {
    if (native || !('Notification' in window) || Notification.permission !== 'granted') return;
    if (document.visibilityState === 'visible' && document.hasFocus()) return;
    const opt = { body, icon: 'icon-192.png', tag: 'timebits' };
    const plain = () => { try { new Notification(title, opt); } catch (e) {} };
    // phones only show notifications through the service worker
    if (navigator.serviceWorker && navigator.serviceWorker.controller)
      navigator.serviceWorker.ready.then(r => r.showNotification(title, opt)).catch(plain);
    else plain();
  }

  // ================= keep the screen on while counting down =================

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => wake = null);
      }
    } catch (e) {}
  }
  function letSleep() { try { if (wake) wake.release(); } catch (e) {} wake = null; }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !$('run').hidden && !pausedAt) { tick(); keepAwake(); }
  });

  // ================= start: ?m=37 or ?bis=18:30 (optional &t=Lunch, &look=3 or &look=ducks, &passed=5) starts right away =================

  const q = new URLSearchParams(location.search);
  const saved = ls.get('timebits');
  ls.del('essen');
  if (q.has('look')) {
    // a number (look.palette, e.g. 3 or 3.2) or a look's name (ducks)
    const v = q.get('look').split('.'), byName = MODES.findIndex(m => m.name === v[0]);
    look = { m: byName >= 0 ? byName : (+v[0] || 0) % MODES.length, p: (+v[1] || 0) % PALETTES.length };
    ls.set('timebits-look', look);
    applyPalette();
  }
  if (saved) { label = saved.label || ''; byTime = !!saved.byTime; }
  if (q.has('m') || q.has('bis') || q.has('pomo')) {
    history.replaceState(null, '', location.pathname);
    label = (q.get('t') || '').trim().slice(0, 40); byTime = false;
    if (q.has('pomo')) beginPomo(Math.max(0, Math.round(+q.get('pomo') || 0)));   // ?pomo=1 starts with the first break
    else if (q.has('bis')) { byTime = true; begin(endFromTime(q.get('bis'))); }
    else {
      setMinutes(+q.get('m'));
      // &passed=N (N minutes already gone) is a testing aid for the local preview only: localhost with a port, or a file;
      // the online version and the store app (Capacitor: localhost without a port) ignore it
      const dev = location.protocol === 'file:' || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.port !== '');
      const passed = dev ? Math.max(0, Math.min(minutes - 1, Math.round(+q.get('passed') || 0))) : 0;
      begin(Date.now() + (minutes - passed) * 60000, passed ? minutes : 0);
    }
  } else if (saved && saved.pomo >= 0 && (saved.pausedAt || Date.now() - saved.end < 12 * 3600000)) {
    // a pomodoro goes on while the app is closed: skip the phases that ended meanwhile (given up after 12 h)
    if (saved.pausedAt) beginPomo(saved.pomo, Date.now() + (saved.end - saved.pausedAt), true);
    else {
      let k = saved.pomo, e = saved.end;
      while (e <= Date.now() + 1000) { k++; e += pomoLen(k) * 60000; }
      beginPomo(k, e);
    }
  } else if (saved && saved.pausedAt) {
    begin(Date.now() + (saved.end - saved.pausedAt), saved.total, true);
  } else if (saved && saved.end > Date.now()) {
    begin(saved.end, saved.total);
  } else if (saved && Date.now() - saved.end < 15 * 60000) {
    finish(true);
  } else {
    ls.del('timebits');
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
