<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinema sounds</title>
<style>
  body { margin: 0; background: #2a2a2e; color: #ccc; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  #phone { width: 360px; height: 640px; max-width: 100%; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 8px #111; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #555; background: #3a3a40; color: #eee; cursor: pointer; }
  button.on { background: #ffd23f; color: #222; border-color: #ffd23f; }
</style>
</head>
<body>
<div id="pick"></div>
<div>Press a sound to hear it; tapping the people then uses that sound too.</div>
<div id="phone"><iframe id="app" src="./?m=12&look=cinema"></iframe></div>
<script>
  // local preview only (the app ignores these messages online and in the store app)
  const SOUNDS = [['shh', '1 · Shhh!'], ['boo', '2 · Booo'], ['tsk', '3 · Tsk tsk'], ['huff', '4 · Pfff (huff)']];
  const app = document.getElementById('app'), pick = document.getElementById('pick');
  app.src += '&_=' + Date.now();   // never an old copy of the app
  SOUNDS.forEach(([kind, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => {
      app.contentWindow.postMessage({ timebits: 'angry', kind }, '*');
      pick.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    };
    pick.appendChild(b);
  });
  pick.firstChild.classList.add('on');
</script>
</body>
</html>
