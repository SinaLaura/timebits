<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower: layers or single ring</title>
<style>
  body { margin: 0; background: #2a2a2e; color: #ccc; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .phone { width: 360px; height: 640px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 8px #111; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  figcaption { font-size: 15px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button { font: inherit; padding: 6px 14px; cursor: pointer; }
  button.on { background: #ccc; color: #222; }
</style>
</head>
<body>
<div class="bar" id="mins">Minutes:</div>
<div class="bar" id="gone">Already gone:</div>
<div class="row">
  <figure><div class="phone"><iframe id="a"></iframe></div><figcaption>Current: several layers (flower)</figcaption></figure>
  <figure><div class="phone"><iframe id="b"></iframe></div><figcaption>Variant: single ring (flowerring)</figcaption></figure>
</div>
<div>Both start at the same moment. Tap the petals to see how they react; tapping the empty background changes the look as usual.</div>
<script>
  // "Already gone" only works on the local preview (the app ignores &passed online)
  const MINS = [10, 25, 60, 120], GONE = [[0, 'nothing'], [1 / 3, 'a third'], [2 / 3, 'two thirds']];
  let m = 25, g = 0;
  const bar = (id, items, set) => {
    const el = document.getElementById(id);
    items.forEach(([val, label]) => {
      const b = document.createElement('button'); b.textContent = label;
      b.onclick = () => { set(val); show(); };
      b.dataset.val = val; b.dataset.group = id; el.appendChild(b);
    });
  };
  bar('mins', MINS.map(v => [v, v + ' min']), v => { m = v; });
  bar('gone', GONE, v => { g = v; });
  function show() {
    document.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.group === 'mins' ? +b.dataset.val === m : +b.dataset.val === g));
    const passed = Math.round(m * g);
    for (const [id, look] of [['a', 'flower'], ['b', 'flowerring']])
      document.getElementById(id).src = './?m=' + m + '&look=' + look + (passed ? '&passed=' + passed : '');
  }
  show();
</script>
</body>
</html>
